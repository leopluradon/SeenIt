# Secrets come from .env next to this file (not in git). See .env.example.
services:
  seenit:
    build:
      context: .
      args:
        SEENIT_VERSION: "${SEENIT_VERSION:-dev}"
        SEENIT_COMMIT: "${SEENIT_COMMIT:-dev}"
        SEENIT_BUILT_AT: "${SEENIT_BUILT_AT:-}"
        SEENIT_SUBJECT_B64: "${SEENIT_SUBJECT_B64:-}"
    image: seenit:latest
    container_name: seenit
    restart: unless-stopped
    depends_on:
      seenit-db:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      ConnectionStrings__Default: "Host=seenit-db;Database=seenit;Username=seenit;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Tmdb__ReadAccessToken: "${TMDB_READ_ACCESS_TOKEN}"
      # Sign-ups need an invite link from a member unless this is true.
      SeenIt__OpenRegistration: "${OPEN_REGISTRATION:-false}"
      SeenIt__PublicUrl: "${PUBLIC_URL:-https://seenit.vohiyo.com/}"
      # Usernames (comma-separated) that can open /admin.
      SeenIt__Admins: "${ADMINS:-leopluradon}"
      # Backup results written by seenit-backup (for the admin page and alert emails).
      SeenIt__StatusDir: /status
      # The Android app, put there by scripts/publish-apk.sh, served at /download/SeenIt.apk.
      SeenIt__DownloadsDir: /downloads
      # Optional: leave SMTP_HOST empty to turn off email (password reset).
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__User: "${SMTP_USER:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__From: "${SMTP_FROM:-}"
      Smtp__Security: "${SMTP_SECURITY:-Auto}"
    volumes:
      - seenit-keys:/keys
      - seenit-status:/status:ro
      - ./downloads:/downloads:ro

  seenit-db:
    image: postgres:17-alpine
    container_name: seenit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: seenit
      POSTGRES_USER: seenit
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - seenit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seenit -d seenit"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Nightly pg_dump to the NAS (data/backups/seenit), 14 days kept. See scripts/backup.sh and restore.sh.
  seenit-backup:
    image: postgres:17-alpine
    container_name: seenit-backup
    restart: unless-stopped
    depends_on:
      seenit-db:
        condition: service_healthy
    environment:
      PGHOST: seenit-db
      PGDATABASE: seenit
      PGUSER: seenit
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      TZ: "${TZ:-America/New_York}"
      BACKUP_HOUR: "3"
      BACKUP_KEEP_DAYS: "14"
      # Weekly off-site copy (user@host:dir); empty disables it. Key + known_hosts live in ./offsite.
      OFFSITE_TARGET: "${OFFSITE_TARGET:-}"
      OFFSITE_KEEP: "${OFFSITE_KEEP:-8}"
    volumes:
      - seenit-backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - ./offsite:/offsite:ro
      - seenit-status:/status
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  seenit-status:
  seenit-keys:
  seenit-db:
  seenit-backups:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_ADDR:-192.168.1.61},nfsvers=4.1,rw,soft,timeo=150"
      device: ":${NAS_BACKUP_PATH:-/volume1/data/backups/seenit}"
