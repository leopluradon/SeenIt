<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SeenIt</title>
    <base href="/" />
    <!-- The saved color theme, before anything paints. -->
    <script>try { var t = localStorage.getItem('seenit.theme'); if (t) document.documentElement.dataset.theme = t; var a = localStorage.getItem('seenit.accent'); if (a) document.documentElement.style.cssText += a; } catch (e) { }</script>
    <link rel="stylesheet" href="_content/SeenIt.UI/seenit.css" />
    <style>
        /* No site footer or hover effects needed inside the app. */
        .footer { display: none; }
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="deeplinks"></div>
    <div id="blazor-error-ui" style="display:none">Something went wrong. <a href="" class="reload">Reload</a></div>
    <script src="_content/SeenIt.UI/seenit.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
